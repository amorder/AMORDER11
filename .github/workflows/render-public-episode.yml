name: Render cinematic AMORDER long-form episode
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.episode.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amorder-public-episode-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify public video caption and thumbnail contract
        run: python tools/test_caption_contract.py

      - name: Install open-source media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg espeak-ng fontconfig fonts-noto-core libegl1 libgl1 libxkbcommon0 libxrender1 libxi6 libxxf86vm1 libsm6 libxext6 libxfixes3
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx

      - name: Cache public Kokoro model files
        uses: actions/cache@v5
        with:
          path: ~/.cache/amorder-kokoro
          key: amorder-kokoro-onnx-v1.1-kokoro-82m

      - name: Download public Kokoro model files
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="$HOME/.cache/amorder-kokoro"
          mkdir -p "$MODEL_DIR"
          test -s "$MODEL_DIR/kokoro-v1.0.onnx" || curl --fail --location --retry 3 --retry-delay 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o "$MODEL_DIR/kokoro-v1.0.onnx"
          test -s "$MODEL_DIR/voices-v1.0.bin" || curl --fail --location --retry 3 --retry-delay 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o "$MODEL_DIR/voices-v1.0.bin"
          echo "MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"

      - name: Render YouTube master and Instagram episode
        shell: bash
        run: |
          set -euo pipefail
          STORYBOARD=$(find posts -maxdepth 1 -type f -name '*.episode.json' | sort | tail -n 1)
          test -n "$STORYBOARD"
          python tools/render_public_episode.py --input "$STORYBOARD" --output-dir assets --model "$MODEL_DIR/kokoro-v1.0.onnx" --voices "$MODEL_DIR/voices-v1.0.bin" --voice af_heart --speed 0.96

      - name: Independently validate long-form media
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path("assets")
          manifests = sorted(root.glob("*-manifest-*.json"))
          assert manifests, "No render manifest found"
          manifest = json.loads(manifests[-1].read_text())
          assert len(manifest["outputs"]) == 2
          for item in manifest["outputs"]:
              path = pathlib.Path(item["file"])
              assert path.exists() and path.stat().st_size > 500_000, path
              meta = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "stream=codec_type,codec_name,width,height", "-show_entries",
                  "format=duration", "-of", "json", str(path)], text=True))
              video = next(s for s in meta["streams"] if s["codec_type"] == "video")
              audio = next(s for s in meta["streams"] if s["codec_type"] == "audio")
              assert video["codec_name"] == "h264"
              assert audio["codec_name"] == "aac"
              assert item["subtitle"] and pathlib.Path(item["subtitle"]).exists()
              assert item.get("captions_burned") is True
              if item["width"] > item["height"]:
                  thumbnail = pathlib.Path(item["thumbnail"])
                  assert thumbnail.exists() and thumbnail.stat().st_size > 50_000, thumbnail
              print("PASS", path, item["duration_seconds"], video["width"], video["height"], "burned captions")
          assert manifest.get("chapters"), "Missing chapter timestamps"
          PY

      - name: Commit only this run's generated episode assets without binary rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --mixed "origin/$GITHUB_REF_NAME"
            python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifests = sorted((root / "assets").glob("*-manifest-*.json"))
          if not manifests:
              raise SystemExit("No episode render manifest found")
          manifest_path = manifests[-1]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          outputs = manifest.get("outputs", [])
          if len(outputs) != 2:
              raise SystemExit(f"Expected exactly two episode outputs, found {len(outputs)}")

          paths = [manifest_path]
          for item in outputs:
              for field in ("file", "subtitle", "thumbnail"):
                  value = item.get(field)
                  if not value:
                      continue
                  path = pathlib.Path(value)
                  if path.is_absolute():
                      path = path.relative_to(root)
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"Missing or empty manifest asset: {path}")
                  paths.append(path)

          paths = list(dict.fromkeys(paths))
          subprocess.run(["git", "add", "--", *[str(path) for path in paths]], check=True)
          print("Staged only files named by the current episode manifest:")
          for path in paths:
              print(f" - {path}")
          PY
            if git diff --cached --quiet; then
              echo "No generated long-form asset changes."
              exit 0
            fi
            git commit -m "content: render cinematic episode assets and subtitles"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push raced with another content commit; retrying from updated main (attempt $attempt)." >&2
          done
          echo "Failed to publish generated long-form assets after three fast-forward attempts." >&2
          exit 1
