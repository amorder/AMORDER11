name: Public repository secret guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Supplemental Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan every reachable Git blob for credential patterns
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          patterns = {
              "private-key block": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "GitHub token": re.compile(
                  rb"(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})"
              ),
              "AWS access key id": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "Google API key": re.compile(rb"AIza[0-9A-Za-z_-]{35}"),
              "Slack token": re.compile(rb"xox[baprs]-[A-Za-z0-9-]{10,}"),
              "Stripe live secret": re.compile(rb"(?:sk|rk)_live_[A-Za-z0-9]{16,}"),
              "Telegram bot token": re.compile(rb"\\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\\b"),
              "credential assignment": re.compile(
                  rb"(?i)(?:api[_-]?key|access[_-]?token|client[_-]?secret|password|secret[_-]?key)"
                  rb"\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{20,}"
              ),
          }

          records = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"]
          ).splitlines()
          objects = {}
          for record in records:
              sha, _, path = record.partition(b" ")
              if re.fullmatch(rb"[0-9a-f]{40,64}", sha):
                  objects.setdefault(sha, path.decode("utf-8", "replace") or "(path unavailable)")

          findings = []
          for sha, path in objects.items():
              try:
                  kind = subprocess.check_output(
                      ["git", "cat-file", "-t", sha], text=True
                  ).strip()
                  if kind != "blob":
                      continue
                  data = subprocess.check_output(["git", "cat-file", "blob", sha])
              except subprocess.CalledProcessError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      findings.append(f"{path}: possible {label}")

          if findings:
              print("Potential secret material found in Git history or current files:")
              print("\n".join(sorted(set(findings))))
              print("Revoke or rotate any real credential; deleting a file is not enough.")
              sys.exit(1)

          print(f"PASS: scanned {len(objects)} unique reachable Git objects; no configured credential patterns found.")
          PY

      - name: Note supplemental scanner status
        if: steps.gitleaks.outcome == 'failure'
        run: echo "::warning::Gitleaks could not complete; the built-in full-history credential-pattern scan completed separately."
