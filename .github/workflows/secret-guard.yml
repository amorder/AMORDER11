name: Public repository secret guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked files for obvious secrets
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "private-key block": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "GitHub token": re.compile(
                  rb"(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})"
              ),
              "AWS access key id": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "credential assignment": re.compile(
                  rb"(?i)(?:api[_-]?key|access[_-]?token|client[_-]?secret|password)"
                  rb"\s*[:=]\s*[\"']?[A-Za-z0-9_./+=-]{20,}"
              ),
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          findings = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", "replace"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      findings.append(f"{path}: possible {label}")

          if findings:
              print("Potential secret material found:")
              print("\n".join(findings))
              print("Remove the value and rotate the credential if it was real.")
              sys.exit(1)

          print("No obvious credential patterns found in tracked files.")
          PY
