name: Render public AMORDER short
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.short.json'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-noto-core
          pip install pillow
      - name: Render vertical video
        shell: bash
        run: |
          STORYBOARD=$(find posts -maxdepth 1 -type f -name '*.short.json' | sort | tail -n 1)
          test -n "$STORYBOARD"
          python tools/render_public_short.py --input "$STORYBOARD" --output assets/amorder-trade-journey-2026-11-06.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 assets/amorder-trade-journey-2026-11-06.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 assets/amorder-trade-journey-2026-11-06.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 assets/amorder-trade-journey-2026-11-06.mp4
      - name: Commit generated public asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/amorder-trade-journey-2026-11-06.mp4
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "content: render AMORDER trade journey short"
          git push
