name: Render public AMORDER short
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.short.json'
permissions:
  contents: write
concurrency:
  group: amorder-public-short-main
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-noto-core
          pip install pillow
      - name: Render vertical video
        shell: bash
        run: |
          STORYBOARD=$(find posts -maxdepth 1 -type f -name '*.short.json' | sort | tail -n 1)
          test -n "$STORYBOARD"
          DATE_TAG=$(basename "$STORYBOARD" .short.json | cut -d'-' -f1-3)
          OUTPUT="assets/amorder-trade-journey-"$DATE_TAG".mp4"
          python tools/render_public_short.py --input "$STORYBOARD" --output "$OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$OUTPUT"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT"
          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
      - name: Commit generated public asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "content: render AMORDER trade journey short"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
