name: Render public AMORDER short
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.short.json'
  workflow_dispatch:
    inputs:
      storyboard:
        description: Storyboard JSON path under posts/
        required: true
        default: posts/2026-11-06-trade-journey.short.json
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow
      - name: Select storyboard
        id: story
        shell: bash
        run: |
          if [ -n "\${{ github.event.inputs.storyboard }}" ]; then
            echo "path=\${{ github.event.inputs.storyboard }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" | grep -E '^posts/.*\.short\.json$' | head -n 1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Render vertical video
        run: |
          test -n "\${{ steps.story.outputs.path }}"
          python tools/render_public_short.py --input "\${{ steps.story.outputs.path }}" --output assets/amorder-trade-journey-2026-11-06.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 assets/amorder-trade-journey-2026-11-06.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 assets/amorder-trade-journey-2026-11-06.mp4
      - name: Commit generated public asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/amorder-trade-journey-2026-11-06.mp4
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "content: render AMORDER trade journey short"
          git push
